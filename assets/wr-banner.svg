<g class="glitch-a"><text x="600" y="196" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="72" font-weight="700" clip-path="url(#t2)" fill="#20C9B0">vviktooor</text></g>
<g class="glitch-b"><text x="600" y="196" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="72" font-weight="700" clip-path="url(#t2)" fill="#3267E9">vviktooor</text></g>
