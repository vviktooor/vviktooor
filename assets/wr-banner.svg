<g class="flicker">
<g transform="translate(60 41)">
<g class="glitch-a"><use href="#mark" xlink:href="#mark" filter="url(#tint-signal)"/></g>
<g class="glitch-b"><use href="#mark" xlink:href="#mark" filter="url(#tint-blue)"/></g>
<use href="#mark" xlink:href="#mark"/>
<g class="slice" clip-path="url(#band1)"><rect y="40" width="440" height="34" fill="#121B2B"/><use href="#mark" xlink:href="#mark"/></g>
<g class="slice" clip-path="url(#band2)"><rect y="150" width="440" height="22" fill="#121B2B"/><use href="#mark" xlink:href="#mark"/></g>
