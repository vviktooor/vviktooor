<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Languages: Python 56.6%, HTML 10.5%, PHP 8.7%, CSS 7.9%, Other 16.3%"><style>
.wr-in{animation:wr-in .7s cubic-bezier(.22,1,.36,1) both}
.wr-grow-y{transform-box:fill-box;transform-origin:50% 100%;animation:wr-grow-y .9s cubic-bezier(.22,1,.36,1) both}
.wr-grow-x{transform-box:fill-box;transform-origin:0 50%;animation:wr-grow-x 1s cubic-bezier(.22,1,.36,1) both}
.wr-blink{animation:wr-blink 1s steps(1) infinite}
@keyframes wr-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes wr-grow-y{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes wr-grow-x{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes wr-blink{50%{fill-opacity:0}}
@media (prefers-reduced-motion:reduce){.wr-in,.wr-grow-y,.wr-grow-x,.wr-blink{animation:none}}
